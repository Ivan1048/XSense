services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xsense-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - yamnet_cache:/app/.tfhub_cache
    environment:
      - PYTHONUNBUFFERED=1
      - TFHUB_CACHE_DIR=/app/.tfhub_cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xsense-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  yamnet_cache:
