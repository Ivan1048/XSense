name: XSense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend TypeScript Check & Production Build
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build

      - name: Frontend Alert Focus Unit Tests (5/5)
        run: node --experimental-strip-types --test frontend/src/utils/alertFocus.test.mjs

      - name: Frontend 3D LiDAR Geometry & Occlusion Tests (33/33)
        working-directory: frontend
        run: |
          ./node_modules/.bin/esbuild src/utils/__tests__/runLidarTests.ts --bundle --platform=node --format=esm --outfile=/tmp/runLidarTests.mjs
          node /tmp/runLidarTests.mjs

      - name: Backend Unit Tests
        run: python -m unittest discover -s backend/tests -v

      - name: Cross-Language LiDAR Parity Verification (33,800 checks)
        run: python backend/tests/verify_lidar_parity.py

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
